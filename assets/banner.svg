<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" style="background:#0f172a; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.07)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-node {
      animation: pulse 3s infinite ease-in-out;
    }
    .flow-line {
      stroke-dasharray: 8 8;
      animation: dash 20s linear infinite;
    }
    .float-card {
      animation: float 6s infinite ease-in-out;
    }
    .float-card-delay {
      animation: float 6s infinite ease-in-out 3s;
    }

    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Decorative Background Grid Lines -->
  <path d="M0,80 L1200,80 M0,160 L1200,160 M0,240 L1200,240 M0,320 L1200,320" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M200,0 L200,400 M400,0 L400,400 M600,0 L600,400 M800,0 L800,400 M1000,0 L1000,400" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Animated Dynamic Background Architecture Flows (Positioned to not block text) -->
  <!-- Left Side Network Nodes -->
  <g opacity="0.6">
    <path class="flow-line" d="M -50 320 Q 150 260 180 350 T 350 280" stroke="url(#accent-grad)" stroke-width="2" fill="none"/>
    <circle cx="180" cy="350" r="4" fill="#38bdf8" class="pulse-node"/>
    <circle cx="350" cy="280" r="6" fill="#818cf8" class="pulse-node"/>
  </g>

  <!-- Right Side Animated Nodes & Cards -->
  <g class="float-card">
    <rect x="850" y="60" width="280" height="70" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="885" cy="95" r="14" fill="#38bdf8" opacity="0.2"/>
    <path d="M879 95 L891 95 M885 89 L885 101" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
    <text x="915" y="91" fill="#f8fafc" font-size="14" font-weight="600">Composable CMS</text>
    <text x="915" y="108" fill="#94a3b8" font-size="12">Headless &amp; API-First Core</text>
  </g>

  <g class="float-card-delay">
    <rect x="890" y="160" width="270" height="70" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="925" cy="195" r="14" fill="#818cf8" opacity="0.2"/>
    <path d="M919 195 L931 195 M925 189 L925 201" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <text x="955" y="191" fill="#f8fafc" font-size="14" font-weight="600">Personalization Engine</text>
    <text x="955" y="208" fill="#94a3b8" font-size="12">Real-time Omnichannel AI</text>
  </g>

  <g class="float-card">
    <rect x="830" y="260" width="290" height="70" rx="12" fill="url(#card-grad)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <circle cx="865" cy="295" r="14" fill="#c084fc" opacity="0.2"/>
    <path d="M859 295 L871 295 M865 289 L865 301" stroke="#c084fc" stroke-width="2" stroke-linecap="round"/>
    <text x="895" y="291" fill="#f8fafc" font-size="14" font-weight="600">Customer Data Platform</text>
    <text x="895" y="308" fill="#94a3b8" font-size="12">Unified Analytics &amp; Journeys</text>
  </g>

  <!-- Flow Lines Connecting Cards -->
  <path class="flow-line" d="M 990 130 L 990 160" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.4"/>
  <path class="flow-line" d="M 975 230 L 975 260" stroke="#c084fc" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- Foreground Title and Subtitle Area (Completely Clear of Overlapping Dynamic Elements) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Badge -->
    <rect x="0" y="85" width="230" height="32" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="#38bdf8" stroke-width="1"/>
    <text x="115" y="106" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="175" fill="#ffffff" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Digital</text>
    <text x="0" y="225" fill="url(#accent-grad)" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">Experience Platform</text>

    <!-- Subtitle -->
    <text x="0" y="275" fill="#94a3b8" font-size="17" font-weight="400" width="600">
      Enterprise DXP • Headless CMS • Omnichannel Personalization • Open Source
    </text>

    <!-- Stats Badges -->
    <g transform="translate(0, 310)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="130" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="65" y="22" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">SaaS &amp; Open Source</text>

      <!-- Badge 2 -->
      <rect x="142" y="0" width="130" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="207" y="22" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Enterprise Grade</text>

      <!-- Badge 3 -->
      <rect x="284" y="0" width="130" height="36" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="349" y="22" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">Composable DXP</text>
    </g>
  </g>

</svg>
